<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" aria-label="Cloudflare にはゆかりの Partner DO とあかりの Partner DO が別々にあり、状態は共有しない。LLM プロバイダ、gpu-box、Gateway のホストは物理的には1つずつだが、それぞれの中でゆかりの分とあかりの分が分かれている">
<style>
svg {
  --bg: #f4f6f2; --fg: #1d231e; --muted: #5d665e; --line: #c6cdc3; --surface: #ffffff;
  --reg-c: #f0eae3; --reg-in: #e6ddd2; --reg-h: #e6eee3; --reg-g: #e3ece8; --reg-d: #e9ebf0;
  --accent: #2b6a8c; --key-bg: #dcebf3; --note: #f7f3e8; --gate: #fbe9d6; --gate-line: #b07a3c;
  --heart: #f6e4e6; --heart-line: #b05a68; --brain: #ece6f4; --brain-line: #6e5a9c;
  --yukari: #7a5ba6; --yukari-bg: #efe9f7; --akari: #b8701a; --akari-bg: #fbf0e1;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
 color: var(--fg); }
@media (prefers-color-scheme: dark) { svg {
  --bg: #141815; --fg: #e3e8e1; --muted: #9aa49b; --line: #3a433b; --surface: #1c221d;
  --reg-c: #2a241e; --reg-in: #352d24; --reg-h: #19231a; --reg-g: #1a2622; --reg-d: #1e2129;
  --accent: #73b6da; --key-bg: #17303d; --note: #2a2a20; --gate: #3a2c1c; --gate-line: #d9a566;
  --heart: #3a2226; --heart-line: #e08d9a; --brain: #2a2438; --brain-line: #b2a0dc;
  --yukari: #b9a2e0; --yukari-bg: #2a2338; --akari: #e8b061; --akari-bg: #362a1a;
  
 } }
.bg { fill: var(--surface); }
text { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; fill: var(--fg); }
.t { font-size: 14px; font-weight: 700; }
.tl { font-size: 16px; font-weight: 700; }
.ct { font-size: 12.5px; font-weight: 700; }
.s { font-size: 11.5px; fill: var(--muted); }
.m { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; fill: var(--muted); }
.lbl { font-size: 11.5px; }
.pt { font-size: 11px; font-weight: 700; fill: var(--accent); }
.rl { font-size: 12px; font-weight: 700; fill: var(--muted); letter-spacing: 0.04em; }
.gt { font-size: 11px; font-weight: 700; fill: var(--gate-line); }
.region-c { fill: var(--reg-c); }
.region-in { fill: var(--reg-in); }
.region-h { fill: var(--reg-h); }
.region-g { fill: var(--reg-g); }
.region-d { fill: var(--reg-d); }
.node { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.ghost { fill: var(--surface); stroke: var(--muted); stroke-width: 1.1; stroke-dasharray: 4 4; }
.heart { fill: var(--heart); stroke: var(--heart-line); stroke-width: 1.6; }
.brain { fill: var(--brain); stroke: var(--brain-line); stroke-width: 1.6; }
.key { fill: var(--key-bg); stroke: var(--accent); stroke-width: 1.8; }
.port { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.port-ghost { fill: var(--surface); stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 4 3; }
.gate { fill: var(--gate); stroke: var(--gate-line); stroke-width: 1.4; }
.frame { fill: none; stroke: var(--muted); stroke-width: 1.1; stroke-dasharray: 5 4; }
.edge { stroke: currentColor; stroke-width: 1.4; fill: none; }
.edge-ghost { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
.lifeline { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 4; }
.do-y { fill: var(--yukari-bg); stroke: var(--yukari); stroke-width: 1.8; }
.do-a { fill: var(--akari-bg); stroke: var(--akari); stroke-width: 1.8; }
.lane-y { fill: var(--yukari-bg); stroke: var(--yukari); stroke-width: 1.2; }
.lane-a { fill: var(--akari-bg); stroke: var(--akari); stroke-width: 1.2; }
.bus-y { stroke: var(--yukari); stroke-width: 2.2; fill: none; }
.bus-a { stroke: var(--akari); stroke-width: 2.2; fill: none; }
.ty { font-size: 13px; font-weight: 700; fill: var(--yukari); }
.ta { font-size: 13px; font-weight: 700; fill: var(--akari); }
.sep { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
.ah { fill: currentColor; }
</style>
<rect class="bg" width="1100" height="460"/>
          <rect class="region-c" x="10" y="20" width="1080" height="175" rx="10"/>
          <text class="rl" x="24" y="44">Cloudflare（コア）</text>
          <rect class="region-h" x="10" y="240" width="1080" height="205" rx="10"/>
          <text class="rl" x="24" y="260">共有する器官と経路（物理的には1つずつ）</text>

          <rect class="do-y" x="90" y="58" width="400" height="118" rx="8"/>
          <text class="ty" x="290" y="82" text-anchor="middle">ゆかりの Partner DO</text>
          <rect class="heart" x="115" y="98" width="110" height="56" rx="6"/>
          <text class="t" x="170" y="131" text-anchor="middle">心</text>
          <rect class="brain" x="235" y="98" width="110" height="56" rx="6"/>
          <text class="t" x="290" y="131" text-anchor="middle">脳</text>
          <rect class="key" x="355" y="98" width="110" height="56" rx="6"/>
          <text class="t" x="410" y="131" text-anchor="middle">身体</text>

          <rect class="do-a" x="610" y="58" width="400" height="118" rx="8"/>
          <text class="ta" x="810" y="82" text-anchor="middle">あかりの Partner DO</text>
          <rect class="heart" x="635" y="98" width="110" height="56" rx="6"/>
          <text class="t" x="690" y="131" text-anchor="middle">心</text>
          <rect class="brain" x="755" y="98" width="110" height="56" rx="6"/>
          <text class="t" x="810" y="131" text-anchor="middle">脳</text>
          <rect class="key" x="875" y="98" width="110" height="56" rx="6"/>
          <text class="t" x="930" y="131" text-anchor="middle">身体</text>

          <line class="sep" x1="550" y1="58" x2="550" y2="176"/>
          <text class="s" x="550" y="110" text-anchor="middle">状態は</text>
          <text class="s" x="550" y="126" text-anchor="middle">共有しない</text>

          <polyline class="bus-y" points="290,176 290,215"/>
          <line class="bus-y" x1="115" y1="215" x2="835" y2="215"/>
          <line class="bus-y" x1="115" y1="215" x2="115" y2="304"/>
          <line class="bus-y" x1="475" y1="215" x2="475" y2="304"/>
          <line class="bus-y" x1="835" y1="215" x2="835" y2="304"/>
          <polyline class="bus-a" points="810,176 810,230"/>
          <line class="bus-a" x1="265" y1="230" x2="985" y2="230"/>
          <line class="bus-a" x1="265" y1="230" x2="265" y2="304"/>
          <line class="bus-a" x1="625" y1="230" x2="625" y2="304"/>
          <line class="bus-a" x1="985" y1="230" x2="985" y2="304"/>

          <rect class="node" x="30" y="270" width="320" height="165" rx="8"/>
          <text class="t" x="190" y="292" text-anchor="middle">LLM プロバイダ</text>
          <rect class="lane-y" x="45" y="304" width="140" height="118" rx="6"/>
          <text class="ty" x="115" y="328" text-anchor="middle">ゆかり</text>
          <text class="s" x="115" y="352" text-anchor="middle">プロンプト</text>
          <text class="s" x="115" y="372" text-anchor="middle">文脈・会話</text>
          <rect class="lane-a" x="195" y="304" width="140" height="118" rx="6"/>
          <text class="ta" x="265" y="328" text-anchor="middle">あかり</text>
          <text class="s" x="265" y="352" text-anchor="middle">プロンプト</text>
          <text class="s" x="265" y="372" text-anchor="middle">文脈・会話</text>

          <rect class="node" x="390" y="270" width="320" height="165" rx="8"/>
          <text class="t" x="550" y="292" text-anchor="middle">gpu-box（ochoko・wol）</text>
          <rect class="lane-y" x="405" y="304" width="140" height="118" rx="6"/>
          <text class="ty" x="475" y="328" text-anchor="middle">ゆかり</text>
          <text class="s" x="475" y="352" text-anchor="middle">声のプリセット</text>
          <text class="s" x="475" y="372" text-anchor="middle">身体の状態</text>
          <text class="s" x="475" y="392" text-anchor="middle">起こし続ける期限</text>
          <rect class="lane-a" x="555" y="304" width="140" height="118" rx="6"/>
          <text class="ta" x="625" y="328" text-anchor="middle">あかり</text>
          <text class="s" x="625" y="352" text-anchor="middle">声のプリセット</text>
          <text class="s" x="625" y="372" text-anchor="middle">身体の状態</text>
          <text class="s" x="625" y="392" text-anchor="middle">起こし続ける期限</text>

          <rect class="node" x="750" y="270" width="320" height="165" rx="8"/>
          <text class="t" x="910" y="292" text-anchor="middle">Gateway のホスト</text>
          <rect class="lane-y" x="765" y="304" width="140" height="118" rx="6"/>
          <text class="ty" x="835" y="328" text-anchor="middle">ゆかり</text>
          <text class="s" x="835" y="352" text-anchor="middle">ゆかりの bot</text>
          <text class="s" x="835" y="372" text-anchor="middle">受信の中継</text>
          <rect class="lane-a" x="915" y="304" width="140" height="118" rx="6"/>
          <text class="ta" x="985" y="328" text-anchor="middle">あかり</text>
          <text class="s" x="985" y="352" text-anchor="middle">あかりの bot</text>
          <text class="s" x="985" y="372" text-anchor="middle">受信の中継</text>
        </svg>