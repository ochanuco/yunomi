name: docker01 app
description: Call chabatake's docker01-app workflow to deploy an image tag of this repo to docker01 and wait for its result.

inputs:
  service:
    description: docker01 service (docker01/<service> in chabatake)
    required: true
  tag:
    description: image tag to deploy (sha-<commit>)
    required: true
  op-service-account-token:
    description: 1Password service account that reads gh-deploy/gpu-box-dispatch
    required: true
  wait-minutes:
    description: how long to wait for the chabatake run, queueing included
    default: "30"

runs:
  using: composite
  steps:
    - id: app
      uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op-service-account-token }}
        CLIENT_ID: op://gh-deploy/gpu-box-dispatch/github_app_client_id
        PRIVATE_KEY: op://gh-deploy/gpu-box-dispatch/github_app_private_key

    - id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ steps.app.outputs.CLIENT_ID }}
        private-key: ${{ steps.app.outputs.PRIVATE_KEY }}
        owner: ochanuco
        repositories: chabatake
        permission-actions: write

    - shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        SERVICE: ${{ inputs.service }}
        TAG: ${{ inputs.tag }}
        WAIT_MINUTES: ${{ inputs.wait-minutes }}
        REQUEST_ID: ${{ github.repository }}#${{ github.run_id }}
      run: bash "$GITHUB_ACTION_PATH/dispatch.sh"
