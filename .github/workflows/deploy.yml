name: deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: デプロイする ref（main、または main 上のコミット SHA）
        required: true
        default: main

permissions:
  contents: read

jobs:
  deploy:
    uses: ochanuco/.github/.github/workflows/deploy.yml@71e324e93ea560488bcc309e52c5ce48ef8a282c # v1.3.0
    with:
      ref: ${{ inputs.ref }}
      # pnpm の版（packageManager）と lockfile はワークスペースのルートにあるので、ルートで install してから worker に移る
      op-env-file: .github/deploy/production.env.op
      run: cd apps/worker && scripts/deploy.sh production
    secrets: inherit
