name: deploy
run-name: deploy yunomi @ ${{ inputs.ref || github.sha }}

# main への push で本番に出す。承認は deploy-plan が危ないと判定したとき（前回の記録なし・ロールバック・追加系でない migration）だけ、
# Environment production-approval で止まる。手動実行はロールバック用
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: デプロイする ref（main、または main 上のコミット SHA。古い SHA はロールバック）
        required: true
        default: main

permissions:
  contents: read

# run 全体を直列にする。名前は deploy.yml のジョブの concurrency（deploy-production）と変える
concurrency:
  group: deploy-run-production
  cancel-in-progress: false

jobs:
  plan:
    uses: ochanuco/.github/.github/workflows/deploy-plan.yml@336944e6c5548c749312671795a28803c5d975da # v1.6.0
    permissions:
      contents: read
      actions: read
    with:
      ref: ${{ inputs.ref || 'main' }}
      approval-environment: production-approval
      migrations: |
        apps/worker/migrations/
  deploy:
    needs: plan
    uses: ochanuco/.github/.github/workflows/deploy.yml@336944e6c5548c749312671795a28803c5d975da # v1.6.0
    with:
      ref: ${{ needs.plan.outputs.sha }}
      approval-environment: ${{ needs.plan.outputs.approval-environment }}
      # pnpm の版（packageManager）と lockfile はワークスペースのルートにあるので、ルートで install してから worker に移る
      op-env-file: .github/deploy/production.env.op
      run: cd apps/worker && scripts/deploy.sh production
    secrets: inherit
