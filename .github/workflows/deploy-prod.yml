name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      ref:
        description: デプロイする ref（main または tag）
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 承認は GitHub の Environment `production` の Required reviewers で行う
    environment: production
    steps:
      - name: ref guard
        env:
          REF: ${{ inputs.ref }}
        run: |
          case "$REF" in
            main | refs/heads/main | refs/tags/* ) ;;
            *)
              if ! git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${REF}" > /dev/null; then
                echo "error: ref は main か tag のみ指定できる: $REF" >&2
                exit 1
              fi
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck test
      - uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
      - name: deploy
        working-directory: apps/worker
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SA_DEPLOY }}
        run: op run --env-file=../../.github/deploy/production.env.op -- scripts/deploy.sh production
