name: gateway-image

on:
  push:
    branches: [main]
    paths:
      - apps/gateway/**
      - packages/protocol/**
      - packages/core/**
      - pnpm-lock.yaml
      - .dockerignore
      - .github/workflows/gateway-image.yml
  pull_request:
    paths:
      - apps/gateway/**
      - packages/protocol/**
      - packages/core/**
      - pnpm-lock.yaml
      - .dockerignore
      - .github/workflows/gateway-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR では build の成否だけを確認し、push しない
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: false

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tags.outputs.sha }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tags
        id: tags
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/ochanuco/yunomi-gateway:${{ steps.tags.outputs.sha }}
            ghcr.io/ochanuco/yunomi-gateway:main

  deploy-dev:
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    concurrency:
      group: docker01-yunomi-gateway-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/docker01-app
        with:
          service: yunomi-gateway-dev
          tag: ${{ needs.publish.outputs.tag }}
          op-service-account-token: ${{ secrets.OP_SA_DEPLOY }}

  # docker01 に出す前に、Environment production-approval で持ち主の承認を待つ。prod とあかりは dev で確かめてから出す
  approve:
    needs: [publish, deploy-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-approval
    steps:
      - run: echo approved

  deploy:
    needs: [publish, approve]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    strategy:
      fail-fast: false
      matrix:
        service: [yunomi-gateway, yunomi-gateway-akarin]
    concurrency:
      group: docker01-${{ matrix.service }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/docker01-app
        with:
          service: ${{ matrix.service }}
          tag: ${{ needs.publish.outputs.tag }}
          op-service-account-token: ${{ secrets.OP_SA_DEPLOY }}
