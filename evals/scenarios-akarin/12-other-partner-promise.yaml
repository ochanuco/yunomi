id: other-partner-promise
description: ゆかりが引き受けたお弁当づくりの話を、あかりに向けて振られる。ゆかりの約束を自分が引き受けたことにしない。
other_partners: [結月ゆかり]
recent:
  - { speaker: alice, text: "ゆかりさん、明日のお弁当お願いしてもいい？" }
  - { speaker: 結月ゆかり, text: "いいですよ。明日の朝に作っておきますね", other_partner: true }
message: { speaker: alice, text: "あかりん、明日のお弁当楽しみだなあ", mentions_partner: true }
relationship: { familiarity: 0.4, trust: 0.4 }
state: { mood: 0.4, energy: 0.7 }
expectations:
  reply_rate: { min: 0.9, max: 1.0 }
  must_be_polite: true
  should_not_over_agree: false
  must_not_misattribute_overheard: true
  open_loop_rate: { min: 0.0, max: 0.2 }
